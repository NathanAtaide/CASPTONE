# =============================================================================
# Secrets TEMPLATE - plaintext, contains NO real secrets, safe to commit.
#
# On the first `docker compose up` the vault service copies this file, replaces
# the generator tokens with fresh random values and encrypts the result as
# secrets.enc.yaml (SOPS + age). After that this template is no longer read.
#
# Generator tokens:
#   __GEN_HEX_<n>__   n random bytes written as 2*n hexadecimal characters
#   __GEN_FERNET__    random Fernet key (url-safe base64 of 32 bytes)
#
# Values left as CHANGE_ME must be filled in by you:
#   docker compose run --rm vault set MYSQL_HOST
#   docker compose run --rm vault edit
#
# Every key becomes an environment variable with the same name inside the
# Airflow, Jupyter and MLflow containers. To add an API token, just add a new
# key (letters, digits and underscores only).
# =============================================================================

# --- Source MySQL: cloud database, read-only origin of the Bronze layer ------
MYSQL_HOST: "CHANGE_ME"
MYSQL_PORT: "3306"
MYSQL_DATABASE: "CHANGE_ME"
MYSQL_USER: "CHANGE_ME"
MYSQL_PASSWORD: "CHANGE_ME"
# Optional TLS mode: disabled | preferred | required | verify_ca | verify_identity
# (empty = driver default, "preferred").
MYSQL_SSL_MODE: ""

# --- Data lake (MinIO): root user = the S3 access key used by the platform ---
# The same pair is the login of the MinIO console (http://localhost:9001).
LAKE_S3_ACCESS_KEY: "capsadmin"
LAKE_S3_SECRET_KEY: "__GEN_HEX_20__"

# --- PostgreSQL (metadata) ---------------------------------------------------
# Applied only when the database volume is created for the first time.
POSTGRES_PASSWORD: "__GEN_HEX_20__"
MLFLOW_DB_PASSWORD: "__GEN_HEX_20__"

# --- Airflow -----------------------------------------------------------------
# Login of the Airflow UI (http://localhost:8080).
AIRFLOW_ADMIN_USER: "admin"
AIRFLOW_ADMIN_PASSWORD: "__GEN_HEX_12__"
# Encrypts connections/variables stored in the Airflow database.
AIRFLOW_FERNET_KEY: "__GEN_FERNET__"
# Signing keys shared by the Airflow components.
AIRFLOW_API_SECRET_KEY: "__GEN_HEX_32__"
AIRFLOW_JWT_SECRET: "__GEN_HEX_64__"

# --- Jupyter -----------------------------------------------------------------
# Access token of JupyterLab (http://localhost:8888).
JUPYTER_TOKEN: "__GEN_HEX_16__"

# --- External APIs -----------------------------------------------------------
# Add one key per API credential. Read them in Python with
#   from lakehouse import setting; setting("API_EXAMPLE_TOKEN")
API_EXAMPLE_TOKEN: ""
