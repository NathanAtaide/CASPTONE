# =============================================================================
# Locations and variables fetched by the open_meteo_daily_to_bronze DAG.
#
# Three cities per marketplace country (order_cab.MARK_COD): the three largest
# urban areas of the country. The gold model gld_weather_country_daily turns
# them into one value per country and day with a simple average.
# country_code is ISO 3166-1 alpha-2, the same code used by the public
# holidays dataset ("Online UK" -> GB).
# Add, remove or change a location here; no Python change is needed.
# =============================================================================

schedule: "30 5 * * *"   # cron in PLATFORM_TIMEZONE; null = manual only

# Daily variables requested from the Open-Meteo historical weather API.
daily_variables:
  - temperature_2m_max
  - temperature_2m_min
  - temperature_2m_mean
  - precipitation_sum
  - rain_sum
  - snowfall_sum
  - precipitation_hours
  - sunshine_duration

