version: 2

models:
  - name: gld_ml_sales
    description: >
      Machine learning training set (not part of the star schema): one row per day, market,
      channel and product category of the PARFOIS sales (type SALE), on a complete date spine
      (days without sales hold 0), with calendar, price, paid media, autoregressive and
      campaign features. Target: total_prod_qty_sold, plus the revenues as auxiliary targets.
      Orders are not here (one order can span several categories): see gld_ml_orders.
    columns:
      # Granularity and categorization keys
      - name: order_date
        description: "Day of the sales (slv_order_cab.order_date). Time key for sorting and time-series splits."
        data_tests:
          - not_null
      - name: mark_cod
        description: "Market (e.g. Online ES)."
        data_tests:
          - not_null
      - name: order_chanel_type
        description: "Sales channel (e.g. DESKTOP, APP, STORE). Name kept as in the source."
        data_tests:
          - not_null
      - name: cat_des_en
        description: "Product category (slv_product.cat_des_en). The 5 non-retail categories are left out."
        data_tests:
          - not_null
      - name: macro_cat_group
        description: >
          Macro group of the category (5 retail families of the profiling). Null for a category
          outside the mapping in gld_ml_sales.sql: add it there.
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values:
                  - JEWELLERY_AND_WATCHES
                  - BAGS_AND_SMALL_GOODS
                  - SUMMER_AND_TRAVEL
                  - WINTER_AND_APPAREL
                  - PARTY_AND_LIFESTYLE

      # Calendar
      - name: year
        description: "Calendar year (slv_calendar.year_number)."
      - name: month
        description: "Month of the year, 1 to 12 (slv_calendar.month_number)."
      - name: day_of_week
        description: "ISO day of the week: 1 = Monday ... 7 = Sunday (slv_calendar.day_of_week)."
      - name: is_weekend
        description: "1 on Saturdays and Sundays, 0 otherwise."

      # Targets and price context
      - name: total_prod_qty_sold
        description: "Target: units sold (sum of slv_order_det.prod_qty of the SALE lines). 0 on days without sales."
        data_tests:
          - not_null
      - name: gross_revenue_wo_disc
        description: "Revenue without discount and without VAT (sum of amount_fixed_rate_wo_disc_wo_vat). Auxiliary target: never a feature of day t."
      - name: net_revenue_w_disc
        description: "Revenue with discount and without VAT (sum of amount_fixed_rate_w_disc_wo_vat). Auxiliary target: never a feature of day t."
      - name: avg_unit_base_price
        description: "gross_revenue_wo_disc / total_prod_qty_sold; on zero-sale days, the last known price of the series."

      # Paid media, lags and category weight
      - name: daily_market_paid_media
        description: >
          Paid media spend of the market on day t (slv_paid_media.marketplace = mark_cod), repeated
          across channels and categories. 0 when the market spent nothing; null outside the dates
          covered by slv_paid_media.
      - name: paid_media_rolling_7d_avg
        description: "Average of daily_market_paid_media over t-6..t. Null until the 7 days are available."
      - name: qty_sold_lag_1d
        description: "Units sold by the series on t-1. Null on the first day of the data."
      - name: qty_sold_lag_7d
        description: "Units sold by the series on t-7. Null on the first 7 days of the data."
      - name: qty_sold_rolling_7d_avg
        description: "Average of the units sold by the series over t-7..t-1. Null until the 7 days are available."
      - name: cat_share_market_rolling_30d
        description: >
          Units of the category in the market (all channels) over t-30..t-1, divided by all units
          of the market over the same days (0 to 1). Null until the 30 days are available.

      # Campaign events
      - name: macro_event_type
        description: >
          Holiday / calendar event active on day t in the market (or in 'All'). Several at once:
          the highest urgency wins, then BLACK_FRIDAY > CHRISTMAS > REYES > MOTHERS_DAY >
          VALENTINES > EASTER > SINGLES_DAY. NONE when there is none.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - BLACK_FRIDAY
                  - CHRISTMAS
                  - REYES
                  - MOTHERS_DAY
                  - VALENTINES
                  - EASTER
                  - SINGLES_DAY
                  - NONE
      - name: general_campaign_type
        description: >
          Tactical campaign active on day t. Several at once: PRICE_PROMO_CLEARANCE >
          BASKET_OR_SHIPPING > SEASONAL_COLLECTION. NONE when there is none.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PRICE_PROMO_CLEARANCE
                  - BASKET_OR_SHIPPING
                  - SEASONAL_COLLECTION
                  - NONE
      - name: promo_urgency_level
        description: "Highest urgency of the active flags: 0 none, 1 warm-up, 2 standard, 3 last days / extended, 4 last hours."
        data_tests:
          - not_null
      - name: active_campaigns_count
        description: "Number of distinct is_* flags of the profiling active on day t in the market."
        data_tests:
          - not_null
