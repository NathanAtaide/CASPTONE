# =============================================================================
# Bronze layer = dbt SOURCES (dbt does not build bronze, it only reads it).
#
# Each source points at the Parquet files written by the ingestion DAGs:
#   s3://<bronze bucket>/<source system>/<table>/ingestion_date=YYYY-MM-DD/*.parquet
#
# `external_location` is a dbt-duckdb setting: {name} is replaced by the table
# name, and DuckDB reads every partition of that table straight from the lake
# (hive_partitioning exposes the `ingestion_date` column; union_by_name copes
# with columns added to the source over time).
# =============================================================================
version: 2

sources:
  # ---------------------------------------------------------------------------
  # Tables extracted from the source MySQL by the bronze_mysql_ingestion DAG.
  # Declare here every table listed in airflow/dags/config/mysql_tables.yml that
  # you want to use in silver models.
  # ---------------------------------------------------------------------------
  - name: bronze_mysql
    description: "Raw tables of the source MySQL database, stored as Parquet in the bronze bucket."
    config:
      external_location: "read_parquet('s3://{{ env_var('LAKE_BUCKET_BRONZE', 'bronze') }}/mysql/{name}/*/*.parquet', hive_partitioning = true, union_by_name = true)"
    # The `name` is the bronze DATASET (the folder under s3://bronze/mysql/),
    # which for unified tables is not the name of a single MySQL table.
    tables:
      - name: customers
        description: "MySQL table customers."
      - name: emails
        description: "Union of the MySQL tables emails, emails_1, emails_2, ... (see _source_entity)."
      - name: events
        description: "MySQL table events."
      - name: order_cab
        description: "MySQL table order_cab."
      - name: order_det
        description: "MySQL table order_det."
      - name: paid_media
        description: "MySQL table paid_media."
      - name: product
        description: "MySQL table product."
      - name: sessions
        description: "Union of the MySQL tables sessions_1, sessions_2, ... (see _source_entity)."

  # ---------------------------------------------------------------------------
  # Weather data from the Open-Meteo public API:
  #   hourly_weather - example dataset landed by the example_api_to_bronze DAG;
  #   daily_weather  - daily weather per marketplace country landed by the
  #                    open_meteo_daily_to_bronze DAG. Read it in silver with
  #                    latest_by_key(..., ['country_code', 'city', 'date']).
  # ---------------------------------------------------------------------------
  - name: bronze_open_meteo
    description: "Weather returned by the Open-Meteo public API."
    config:
      external_location: "read_parquet('s3://{{ env_var('LAKE_BUCKET_BRONZE', 'bronze') }}/open_meteo/{name}/*/*.parquet', hive_partitioning = true, union_by_name = true)"
    tables:
      - name: hourly_weather
        description: "One row per location and hour, as returned by the API, plus the lineage columns."
      - name: daily_weather
        description: "One row per city (three largest cities of each marketplace country) and local day: temperature, rain, snow and sunshine, plus the lineage columns."

  # ---------------------------------------------------------------------------
  # Public holidays landed by the nager_date_to_bronze DAG.
  # One row per holiday and country as returned by the Nager.Date API, plus
  # requested_country_code / requested_year and the lineage columns.
  # Read it in silver with latest_by_key(..., ['countryCode', 'date', 'name']).
  # ---------------------------------------------------------------------------
  - name: bronze_nager_date
    description: "Public holidays per country returned by the Nager.Date public API."
    config:
      external_location: "read_parquet('s3://{{ env_var('LAKE_BUCKET_BRONZE', 'bronze') }}/nager_date/{name}/*/*.parquet', hive_partitioning = true, union_by_name = true)"
    tables:
      - name: public_holidays
        description: "One row per public holiday and country (fields: date, localName, name, countryCode, global, counties, types, launchYear)."
